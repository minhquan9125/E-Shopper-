{% load static %}
{% include 'Layout/header.html' %}

<section>
    <div class="container">
        <div class="row">
            <div class="col-sm-3">
                {% include 'accountleft.html' %}
            </div>
            <div class="col-sm-9">
                <div class="blog-post-area">
                    <h2 class="title text-center">Update user</h2>
                    <div class="signup-form">
                        <h2>User Update!</h2>
                        <form action="" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <input type="text" name="username" value="{{ user.username }}" placeholder="Name" required />
                            <input type="email" name="email" value="{{ user.email }}" placeholder="Email Address" required />
                            <input type="password" name="password" placeholder="Password" />
                            <input type="text" name="address" value="{{ request.user.address|default:'' }}" placeholder="Address" />
                            <select name="id_country">
                                <option value="">-- Select Country --</option>
                                {% for country in countries %}
                                    <option value="{{ country.id }}" {% if request.user.id_country_id == country.id %}selected{% endif %}>
                                        {{ country.name }}
                                    </option>
                                {% endfor %}
                            </select>
                            <input type="text" name="phone" value="{{ request.user.phone|default:'' }}" placeholder="Phone" />
                            <input type="file" name="avatar" accept="image/*" />
                            <button type="submit" class="btn btn-default">Update</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% include 'Layout/footer.html' %}
